
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jefandikoo - Votre marché en ligne</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #123b32;
            color: white;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .intro {
            text-align: center;
            padding: 35px 15px;
        }

        .intro h2 {
            color: #123b32;
        }

        .search {
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .search input {
            width: 85%;
            max-width: 450px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .products {
            padding: 20px;
            text-align: center;
        }

        .product {
            background: white;
            padding: 25px;
            margin: 12px auto;
            max-width: 350px;
            border-radius: 10px;
        }

        footer {
            background: #123b32;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <header>
        <h1>JEFANDIKOO</h1>
        <p>Votre marché, partout au Sénégal</p>
    </header>

    <section class="intro">
        <h2>Bienvenue sur Jefandikoo</h2>
        <p>Trouvez facilement les articles que vous recherchez.</p>
    </section>

    <div class="search">
        <input
            type="search"
            placeholder="Que recherchez-vous ?"
        >
    </div>

    <section class="products">
        <h2>Nos catégories</h2>

        <div class="product">
            📱 Téléphones et accessoires
        </div>

        <div class="product">
            👕 Vêtements et chaussures
        </div>

        <div class="product">
            🚗 Automobile et pièces détachées
        </div>

        <div class="product">
            🏠 Maison et équipements
        </div>
    </section>

    <footer>
        <p>© 2026 Jefandikoo - Sénégal</p>
    </footer>

</body>
</html>
